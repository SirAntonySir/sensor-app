name: SensorApp
options:
  bundleIdPrefix: com.cloudhaus
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"
targets:
  SensorApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudhaus.sensorapp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMotionUsageDescription: "Reads barometric pressure to drive the breathing exercises."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        OTHER_LDFLAGS: "-framework shared"
        # Framework slice is chosen per SDK: device (iphoneos) vs simulator.
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
    preBuildScripts:
      - name: Build KMP Shared Framework
        script: |
          cd "$SRCROOT/.."
          # Link the framework slice matching the SDK being built.
          if [[ "$SDK_NAME" == iphonesimulator* ]]; then
            ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
          else
            ./gradlew :shared:linkDebugFrameworkIosArm64
          fi
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Copy Compose Resources
        script: |
          RESOURCES_SRC="$SRCROOT/../shared/build/generated/compose/resourceGenerator/preparedResources/commonMain/composeResources"
          RESOURCES_DST="$TARGET_BUILD_DIR/$PRODUCT_NAME.app/compose-resources/composeResources/com.cloudhaus.sensorapp.resources"
          if [ -d "$RESOURCES_SRC" ]; then
            mkdir -p "$RESOURCES_DST"
            cp -R "$RESOURCES_SRC/"* "$RESOURCES_DST/"
          fi
        basedOnDependencyAnalysis: false
